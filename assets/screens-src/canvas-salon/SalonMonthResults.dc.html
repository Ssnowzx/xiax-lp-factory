<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel — faturamento do mês — Salão Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F1EA;color:#1C1714;font-family:Manrope,system-ui,sans-serif}
.card{position:absolute;left:265px;top:100px;width:720px;box-sizing:border-box;padding:22px 22px 18px;border-radius:20px;background:#FDFAF5;border:1px solid #E3D9CC;box-shadow:0 1px 2px rgb(28 23 20 / .06),0 4px 12px rgb(28 23 20 / .04);display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:28px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#4A3F38}
.legend span{display:flex;align-items:center;gap:6px}.legend i{display:block}
.plot{position:relative;padding-left:64px;padding-bottom:26px}
.area{position:relative;height:260px}
.tick{position:absolute;left:0;right:0;border-top:1px solid #E3D9CC}
.tick span{position:absolute;left:-64px;top:-9px;width:56px;text-align:right;font-size:12px;color:#6E625A;font-variant-numeric:tabular-nums}
.x{position:absolute;transform:translateX(-50%);font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<section class="card" id="card" aria-labelledby="rev-title">
  <div style="display:flex;flex-direction:column;gap:8px">
    <h2 id="rev-title">Faturamento acumulado</h2>
    <div class="legend">
      <span><i style="width:16px;height:2px;background:#7B4A3C"></i>Outubro</span>
      <span><i style="width:16px;border-top:2px dashed #8F8377"></i>Setembro</span>
      <span><i style="width:16px;height:2px;background:#1F5FA8"></i>Meta</span>
    </div>
  </div>
  <div class="plot">
    <div class="area" id="area">
      <svg id="chart" viewBox="0 0 1000 260" preserveAspectRatio="none" role="img" aria-label="Faturamento acumulado de outubro: R$ 48.320 até o dia 28, acima de setembro no mesmo período (R$ 42.990). Meta do mês: R$ 55.000." style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
        <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B4A3C" stop-opacity="0.22"></stop><stop offset="1" stop-color="#7B4A3C" stop-opacity="0"></stop></linearGradient></defs>
        <line id="goal" x1="0" x2="1000" stroke="#1F5FA8" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
        <path id="sep" fill="none" stroke="#8F8377" stroke-width="1.6" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"></path>
        <path id="octArea" fill="url(#fill)" stroke="none"></path>
        <path id="oct" fill="none" stroke="#7B4A3C" stroke-width="2.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"></path>
      </svg>
      <span id="goalLabel" aria-hidden="true" style="position:absolute;left:8px;transform:translateY(-130%);font-size:12px;font-weight:700;color:#1F5FA8">Meta R$ 55 mil</span>
      <div id="todayLine" aria-hidden="true" style="position:absolute;top:0;bottom:0;border-left:1px solid #8F8377"></div>
      <span id="dot" aria-hidden="true" style="position:absolute;width:11px;height:11px;border-radius:50%;background:#7B4A3C;border:3px solid #FDFAF5;transform:translate(-50%,-50%)"></span>
      <span id="bubble" aria-hidden="true" style="position:absolute;transform:translate(-108%,-160%);padding:4px 9px;border-radius:8px;background:#EFE8DE;border:1px solid #E3D9CC;font-size:13px;font-weight:700;white-space:nowrap">R$ 48.320</span>
    </div>
    <div id="xs" aria-hidden="true" style="position:absolute;left:64px;right:0;bottom:0;height:18px"></div>
  </div>
</section>
<script>
const MAX = 60000, W = 1000, H = 260;
const xOf = (d) => (d - 1) / 30 * W, yOf = (v) => H - v / MAX * H, pct = (v) => (1 - v / MAX) * 100;
const smooth = (pts) => {
  let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const f = (n) => n.toFixed(1);
    d += ' C' + f(p1[0] + (p2[0] - p0[0]) / 6) + ',' + f(p1[1] + (p2[1] - p0[1]) / 6) + ' ' + f(p2[0] - (p3[0] - p1[0]) / 6) + ',' + f(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f(p2[0]) + ',' + f(p2[1]);
  }
  return d;
};
const BASE = [0, 1150, 1500, 1620, 1980, 2560, 3180];
const cumulative = (days, firstWeekday, totalAt28) => {
  const daily = [];
  for (let d = 1; d <= days; d++) { const wd = (firstWeekday + d - 1) % 7; daily.push(BASE[wd] + (wd === 0 ? 0 : (((d * 37) % 11) - 5) * 40)); }
  const k = totalAt28 / daily.slice(0, 28).reduce((a, b) => a + b, 0);
  let acc = 0; return daily.map((v) => (acc += v * k));
};
const oct = cumulative(28, 4, 48320), sep = cumulative(30, 2, 42990);
const octPath = smooth(oct.map((v, i) => [xOf(i + 1), yOf(v)]));
const $ = (id) => document.getElementById(id);
$('oct').setAttribute('d', octPath);
$('octArea').setAttribute('d', octPath + ' L' + xOf(28).toFixed(1) + ',' + H + ' L0,' + H + ' Z');
$('sep').setAttribute('d', smooth(sep.map((v, i) => [xOf(i + 1), yOf(v)])));
$('goal').setAttribute('y1', yOf(55000)); $('goal').setAttribute('y2', yOf(55000));
$('goalLabel').style.top = pct(55000) + '%';
const todayX = (27 / 30 * 100) + '%', todayY = pct(48320) + '%';
$('todayLine').style.left = todayX;
for (const id of ['dot', 'bubble']) { $(id).style.left = todayX; $(id).style.top = todayY; }
const area = $('area');
[60000, 40000, 20000, 0].forEach((v) => { const t = document.createElement('div'); t.className = 'tick'; t.setAttribute('aria-hidden', 'true'); t.style.top = pct(v) + '%'; t.innerHTML = '<span>' + (v === 0 ? 'R$ 0' : 'R$ ' + v / 1000 + ' mil') + '</span>'; area.prepend(t); });
[1, 8, 15, 22, 28, 31].forEach((d) => { const s = document.createElement('span'); s.className = 'x'; s.style.left = (d - 1) / 30 * 100 + '%'; s.style.fontWeight = d === 28 ? 700 : 500; s.style.color = d === 28 ? '#1C1714' : '#6E625A'; s.textContent = d === 28 ? 'Hoje, 28' : d; $('xs').appendChild(s); });
</script>
</body>
</html>
